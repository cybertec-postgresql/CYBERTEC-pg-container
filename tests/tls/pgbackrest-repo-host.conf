[global]
repo1-path=/data/pgbackrest/repo1
repo1-retention-full-type=count
tls-server-address=0.0.0.0
tls-server-port=8432
tls-server-cert-file=/etc/pgbackrest/certs/server.crt
tls-server-key-file=/etc/pgbackrest/certs/server.key
tls-server-ca-file=/etc/pgbackrest/certs/ca.crt
tls-server-auth=postgres=*

[db]
pg1-host=pgcontainer1
pg1-host-type=tls
pg1-host-cert-file=/etc/pgbackrest/certs/client.crt
pg1-host-key-file=/etc/pgbackrest/certs/client.key
pg1-host-ca-file=/etc/pgbackrest/certs/ca.crt
pg1-host-port=8432
pg1-host-user=postgres
pg1-path=/home/postgres/pgdata/pgroot/data

pg2-host=pgcontainer2
pg2-host-type=tls
pg2-host-cert-file=/etc/pgbackrest/certs/client.crt
pg2-host-key-file=/etc/pgbackrest/certs/client.key
pg2-host-ca-file=/etc/pgbackrest/certs/ca.crt
pg2-host-port=8432
pg2-host-user=postgres
pg2-path=/home/postgres/pgdata/pgroot/data
