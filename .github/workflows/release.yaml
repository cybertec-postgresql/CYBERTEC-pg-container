name: release

# Required secrets: REGISTRY_USERNAME, REGISTRY_PASSWORD
# Image names and tags come from the Makefile.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build"
        required: true

env:
  REF: ${{ github.event.release.tag_name || inputs.ref }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: docker/login-action@v3
        with:
          registry: containers.cybertec.at
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build
        run: |
          make ROOTPATH="$GITHUB_WORKSPACE" \
            base-build postgres-build postgres-gis-build \
            pgbackrest-build pgbouncer-build exporter-build

      - name: Push arch-specific tags
        run: |
          repo="$(make -s print-REPOSITORY)/$(make -s print-IMAGE_PATH)"
          while read -r name var; do
            tag="$(make -s print-${var})"
            docker tag  "${repo}/${name}:${tag}" "${repo}/${name}:${tag}-${{ matrix.arch }}"
            docker push "${repo}/${name}:${tag}-${{ matrix.arch }}"
          done <<'LIST'
          postgres IMAGE_TAG
          postgres-gis POSTGIS_IMAGE_TAG
          pgbackrest IMAGE_TAG
          exporter IMAGE_TAG
          pgbouncer PGBOUNCER_IMAGE_TAG
          LIST

  merge:
    name: Multi-arch manifests
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: containers.cybertec.at
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Create manifest lists
        run: |
          repo="$(make -s print-REPOSITORY)/$(make -s print-IMAGE_PATH)"
          while read -r name var; do
            tag="$(make -s print-${var})"
            docker buildx imagetools create -t "${repo}/${name}:${tag}" \
              "${repo}/${name}:${tag}-amd64" "${repo}/${name}:${tag}-arm64"
            docker buildx imagetools inspect "${repo}/${name}:${tag}"
          done <<'LIST'
          postgres IMAGE_TAG
          postgres-gis POSTGIS_IMAGE_TAG
          pgbackrest IMAGE_TAG
          exporter IMAGE_TAG
          pgbouncer PGBOUNCER_IMAGE_TAG
          LIST
