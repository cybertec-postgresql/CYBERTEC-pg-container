name: release

# Required secrets: REGISTRY_USERNAME, REGISTRY_PASSWORD
# Image names and tags come from the Makefile.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build"
        required: true
      dev:
        description: "Build as dev (-dev repository)"
        type: boolean
        default: false

env:
  PLATFORMS: linux/amd64,linux/arm64
  LOCAL_REGISTRY: localhost:5000
  IMAGE_PATH: ${{ (github.event.release.prerelease || inputs.dev) && 'cybertec-pg-container-dev' || 'cybertec-pg-container' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: containers.cybertec.at
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # The base image only lives in the local registry; the final images
      # resolve it from there via a named build context.
      - name: Build base (multi-arch)
        run: |
          base="${LOCAL_REGISTRY}/$(make -s print-IMAGE_PATH)/base:$(make -s print-BASEOS)-$(make -s print-BUILD)"
          echo "BASE_LOCAL=${base}" >> "$GITHUB_ENV"
          make ROOTPATH="$GITHUB_WORKSPACE" base-build \
            BASE_IMAGE_REF="${base}" \
            DOCKER_BUILD="docker buildx build --platform ${PLATFORMS} --push"

      - name: Build and push images (multi-arch)
        run: |
          ctx="$(make -s print-IMAGE_PATH)/base:$(make -s print-BASEOS)-$(make -s print-BUILD)"
          make ROOTPATH="$GITHUB_WORKSPACE" \
            postgres-build postgres-gis-build pgbackrest-build pgbouncer-build exporter-build \
            DOCKER_BUILD="docker buildx build --platform ${PLATFORMS} --push --build-context ${ctx}=docker-image://${BASE_LOCAL}"

      - name: Inspect
        run: |
          repo="$(make -s print-REPOSITORY)/$(make -s print-IMAGE_PATH)"
          docker buildx imagetools inspect "${repo}/postgres:$(make -s print-IMAGE_TAG)"
          docker buildx imagetools inspect "${repo}/pgbouncer:$(make -s print-PGBOUNCER_IMAGE_TAG)"
